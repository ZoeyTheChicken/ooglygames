<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - Classroom</title>
    <script>
        // Array of URLs to choose from
        const urls = [
            "https://chat.oogly.dev",
            "https://chat.basement.sbs"
        ];
        
        // Pick a random index (0 or 1)
        const randomIndex = Math.floor(Math.random() * urls.length);
        
        // Perform the redirect using replace so it doesn't stay in browser history
        window.location.replace(urls[randomIndex]);
    </script>
</head>
<body>
    <p>If you are not redirected automatically, please <a id="fallback-link" href="#">click here</a>.</p>
    <script>
        // Fallback link in case JavaScript is disabled or slow
        document.getElementById('fallback-link').href = urls[randomIndex];
    </script>
