<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#08090c;
--text:#f5f7fb;
--muted:#94a3b8;
--accent:#3b82f6;
--success:#22c55e;
--danger:#ef4444;
--glass:rgba(18,22,30,.58);
--border:rgba(255,255,255,.08);
--mono:'JetBrains Mono', monospace;
}

*{box-sizing:border-box}

body{
margin:0;
padding:40px 20px;
font-family:Inter,sans-serif;
color:var(--text);
background:
radial-gradient(circle at top left, rgba(59,130,246,.18), transparent 35%),
radial-gradient(circle at bottom right, rgba(139,92,246,.12), transparent 40%),
var(--bg);
min-height:100vh;
}

.container{max-width:1100px;margin:auto}

.glass{
background:var(--glass);
backdrop-filter:blur(24px) saturate(180%);
-webkit-backdrop-filter:blur(24px) saturate(180%);
border:1px solid var(--border);
box-shadow:0 10px 40px rgba(0,0,0,.25);
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:22px;
border-radius:24px;
margin-bottom:22px;
}

h1{
margin:0;
font-size:34px;
letter-spacing:-1px;
}

.subtitle{
margin:6px 0 0;
color:var(--muted);
}

.stats{
display:flex;
gap:12px;
margin-bottom:22px;
}

.stat{
padding:14px 18px;
border-radius:18px;
min-width:120px;
}

.stat span{
display:block;
font-size:12px;
color:var(--muted);
}

.stat strong{
font-size:22px;
}

.generator{
padding:24px;
border-radius:24px;
display:flex;
gap:16px;
flex-wrap:wrap;
margin-bottom:32px;
}

.field{
flex:1;
min-width:220px;
}

label{
display:block;
margin-bottom:8px;
font-size:11px;
text-transform:uppercase;
letter-spacing:1px;
font-family:var(--mono);
color:var(--muted);
}

select,input{
width:100%;
height:52px;
padding:0 16px;
border-radius:14px;
border:1px solid var(--border);
background:rgba(255,255,255,.04);
color:white;
font-family:var(--mono);
}

button{
height:52px;
padding:0 24px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:600;
color:white;
background:linear-gradient(180deg,#4b8cff,#2f6fff);
box-shadow:0 10px 24px rgba(59,130,246,.3);
transition:.2s;
}

button:hover{
transform:translateY(-2px);
}

.routes{
display:grid;
gap:20px;
}

.group{
padding:20px;
border-radius:22px;
}

.grouphead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:14px;
}

.domain{
font-family:var(--mono);
color:#8ab4ff;
}

.health{
padding:6px 12px;
border-radius:999px;
font-size:11px;
font-weight:700;
}

.checking{background:rgba(255,255,255,.08)}
.online{background:rgba(34,197,94,.15);color:#4ade80}
.offline{background:rgba(239,68,68,.15);color:#f87171}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:10px;
}

.link{
padding:14px;
border-radius:16px;
border:1px solid var(--border);
background:rgba(255,255,255,.03);
cursor:pointer;
transition:.2s;
}

.link:hover{
transform:translateY(-2px);
border-color:rgba(59,130,246,.45);
}

.url{
font-family:var(--mono);
font-size:12px;
word-break:break-all;
}

.toast{
position:fixed;
bottom:20px;
right:20px;
padding:12px 16px;
border-radius:14px;
background:#111827;
display:none;
}

@media(max-width:700px){
header{flex-direction:column;align-items:flex-start;gap:16px}
.stats{flex-wrap:wrap}
}
</style>
</head>
<body>

<div class="container">

<header class="glass">
<div>
<h1>Access Assistant</h1>
<div class="subtitle">Automatic diagnostic node monitoring active.</div>
</div>
<button onclick="refreshAll()">Check Nodes</button>
</header>

<div class="stats">
<div class="stat glass"><span>Nodes</span><strong id="nodes">0</strong></div>
<div class="stat glass"><span>Online</span><strong id="online">0</strong></div>
</div>

<div class="generator glass">
<div class="field">
<label>Target</label>
<select id="domain"></select>
</div>

<div class="field">
<label>Mask</label>
<select id="type">
<option>?math=</option>
<option>?school=</option>
<option>?study=</option>
<option>?mode=</option>
<option>#</option>
</select>
</div>

<div class="field">
<label>Extension</label>
<input id="kw" placeholder="geometryassignment">
</div>

<div class="field" style="flex:0">
<label>&nbsp;</label>
<button onclick="runTest()">Run Test</button>
</div>
</div>

<div id="routes" class="routes"></div>

<div id="toast" class="toast"></div>

</div>

<script>
const domains=[
{n:"teststudy.vercel.app",v:["","?math=exam","#archive"]},
{n:"ooglylearning.vercel.app",v:["","?math=review","#lab"]},
{n:"ooglygames.vercel.app",v:["","?mode=edu","#stats"]},
{n:"ooglygames1.netlify.app",v:["","?math=stats","#res"]},
{n:"ooglygames2.netlify.app",v:["","?test=final","#archive"]},
{n:"ooglygames3.netlify.app",v:["","?p=logic","#v6"]},
{n:"oogly.chickennet.work",v:["","?mode=edu","#home"]}
];

document.getElementById("nodes").textContent=domains.length;

const select=document.getElementById("domain");
domains.forEach(d=>{
const o=document.createElement("option");
o.textContent=d.n;
select.appendChild(o);
});

function toast(msg){
const t=document.getElementById("toast");
t.textContent=msg;
t.style.display="block";
setTimeout(()=>t.style.display="none",2000);
}

function runTest(){
const d=domain.value;
const t=document.getElementById("type").value;
const k=document.getElementById("kw").value||"curriculum";
window.open(`https://${d}${t}${k}`,"_blank");
}

async function checkHealth(domain,id){
const el=document.getElementById(id);
el.className="health checking";
el.textContent="Checking";

try{
const controller=new AbortController();
setTimeout(()=>controller.abort(),5000);

await fetch(`https://${domain}/favicon.ico?${Date.now()}`,{
mode:"no-cors",
signal:controller.signal
});

el.className="health online";
el.textContent="Online";
}
catch{
el.className="health offline";
el.textContent="Offline";
}

updateOnlineCount();
}

function updateOnlineCount(){
document.getElementById("online").textContent=
document.querySelectorAll(".online").length;
}

function refreshAll(){
domains.forEach((d,i)=>checkHealth(d.n,"h"+i));
}

const routes=document.getElementById("routes");

domains.forEach((d,i)=>{
const group=document.createElement("div");
group.className="group glass";

group.innerHTML=`
<div class="grouphead">
<div class="domain">${d.n}</div>
<div id="h${i}" class="health checking">Checking</div>
</div>
<div class="grid">
${d.v.map(v=>`
<div class="link" onclick="window.open('https://${d.n}${v}','_blank')">
<div class="url">${d.n}${v}</div>
</div>`).join("")}
</div>`;

routes.appendChild(group);
checkHealth(d.n,"h"+i);
});
</script>

</body>
</html>
