<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Classroom</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #ffffff;
    padding: 40px 20px;
    min-height: 100vh;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid #1a1a1a;
}

h1 {
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.5px;
}

.subtitle {
    color: #888;
    font-size: 14px;
    margin-top: 4px;
}

.stats {
    display: flex;
    gap: 30px;
    margin-bottom: 30px;
}

.stat {
    display: flex;
    align-items: baseline;
    gap: 8px;
}

.stat span {
    color: #888;
    font-size: 13px;
}

.stat strong {
    font-size: 24px;
    font-weight: 500;
}

.generator {
    background: #141414;
    border: 1px solid #1a1a1a;
    border-radius: 8px;
    padding: 24px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.field {
    flex: 1;
    min-width: 180px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #666;
}

select, input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    background: #0a0a0a;
    border: 1px solid #1a1a1a;
    border-radius: 6px;
    color: #ffffff;
    font-size: 14px;
}

button {
    height: 44px;
    padding: 0 28px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    color: #ffffff;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
}

button:hover {
    background: #2a2a2a;
}

.routes {
    display: grid;
    gap: 16px;
}

.group {
    background: #141414;
    border: 1px solid #1a1a1a;
    border-radius: 8px;
    padding: 20px;
}

.grouphead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.domain {
    font-family: 'Courier New', monospace;
    color: #aaa;
    font-size: 15px;
}

.health {
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
}

.checking { 
    background: #1a1a1a; 
    color: #666;
}

.online { 
    background: rgba(34, 197, 94, 0.15); 
    color: #4ade80;
}

.offline { 
    background: rgba(239, 68, 68, 0.15); 
    color: #f87171;
}

.blocked { 
    background: rgba(234, 179, 8, 0.15); 
    color: #fbbf24;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 8px;
}

.link {
    padding: 12px 16px;
    border-radius: 6px;
    border: 1px solid #1a1a1a;
    background: rgba(255, 255, 255, 0.02);
    cursor: pointer;
    transition: all 0.2s;
}

.link:hover {
    border-color: #2a2a2a;
    background: rgba(255, 255, 255, 0.04);
}

.url {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: #aaa;
    word-break: break-all;
}

.toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 20px;
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    display: none;
    font-size: 14px;
}

.iframe-check {
    display: none;
}

@media (max-width: 700px) {
    header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
    }
    
    .stats {
        flex-wrap: wrap;
        gap: 16px;
    }
}
</style>
</head>
<body>

<div class="container">

<header>
<div>
<h1>Access Assistant</h1>
<div class="subtitle">Alternate route monitoring</div>
</div>
<button onclick="refreshAll()">Check Alternates</button>
</header>

<div class="stats">
<div class="stat"><span>Alternates</span><strong id="nodes">0</strong></div>
<div class="stat"><span>Online</span><strong id="online">0</strong></div>
<div class="stat"><span>Blocked</span><strong id="blocked">0</strong></div>
</div>

<div class="generator">
<div class="field">
<label>Target</label>
<select id="domain"></select>
</div>

<div class="field">
<label>Mask</label>
<select id="type">
<option>?math=</option>
<option>?school=</option>
<option>?study=</option>
<option>?mode=</option>
<option>#</option>
</select>
</div>

<div class="field">
<label>Extension</label>
<input id="kw" placeholder="geometryassignment">
</div>

<div class="field" style="flex:0">
<label>&nbsp;</label>
<button onclick="runTest()">Run Test</button>
</div>
</div>

<div id="routes" class="routes"></div>

<div id="toast" class="toast"></div>

</div>

<script>
const alternates = [
    {n: "teststudy.vercel.app", v: ["", "?math=exam", "#archive"]},
    {n: "ooglylearning.vercel.app", v: ["", "?math=review", "#lab"]},
    {n: "ooglygames.vercel.app", v: ["", "?mode=edu", "#stats"]},
    {n: "ooglygames1.netlify.app", v: ["", "?math=stats", "#res"]},
    {n: "ooglygames2.netlify.app", v: ["", "?test=final", "#archive"]},
    {n: "ooglygames3.netlify.app", v: ["", "?p=logic", "#v6"]},
    {n: "oogly.chickennet.work", v: ["", "?mode=edu", "#home"]}
];

document.getElementById("nodes").textContent = alternates.length;

const select = document.getElementById("domain");
alternates.forEach(d => {
    const o = document.createElement("option");
    o.textContent = d.n;
    select.appendChild(o);
});

function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2000);
}

function runTest() {
    const d = document.getElementById("domain").value;
    const t = document.getElementById("type").value;
    const k = document.getElementById("kw").value || "curriculum";
    window.open(`https://${d}${t}${k}`, "_blank");
}

function checkHealth(domain, id) {
    const el = document.getElementById(id);
    el.className = "health checking";
    el.textContent = "Checking";

    const iframe = document.createElement('iframe');
    iframe.className = 'iframe-check';
    iframe.src = `https://${domain}/?${Date.now()}`;
    
    let checked = false;
    let timeoutId = setTimeout(() => {
        if (!checked) {
            el.className = "health offline";
            el.textContent = "Offline";
            checked = true;
            updateCounts();
        }
    }, 4000);

    iframe.onload = function() {
        if (checked) return;
        checked = true;
        clearTimeout(timeoutId);
        
        try {
            const blockedKeywords = ['goguardian', 'blocked', 'restricted', 'access denied'];
            let isBlocked = false;
            
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const bodyText = doc.body ? doc.body.innerText.toLowerCase() : '';
                isBlocked = blockedKeywords.some(kw => bodyText.includes(kw));
                
                if (doc.title && doc.title.toLowerCase().includes('blocked')) {
                    isBlocked = true;
                }
            } catch (e) {
                // Cross-origin - likely a real page, which is good
                isBlocked = false;
            }
            
            if (isBlocked) {
                el.className = "health blocked";
                el.textContent = "Blocked";
            } else {
                el.className = "health online";
                el.textContent = "Online";
            }
        } catch (e) {
            el.className = "health online";
            el.textContent = "Online";
        }
        
        updateCounts();
        document.body.removeChild(iframe);
    };

    iframe.onerror = function() {
        if (checked) return;
        checked = true;
        clearTimeout(timeoutId);
        el.className = "health offline";
        el.textContent = "Offline";
        updateCounts();
        document.body.removeChild(iframe);
    };

    document.body.appendChild(iframe);
}

function updateCounts() {
    const online = document.querySelectorAll('.online').length;
    const blocked = document.querySelectorAll('.blocked').length;
    document.getElementById('online').textContent = online;
    document.getElementById('blocked').textContent = blocked;
}

function refreshAll() {
    alternates.forEach((d, i) => checkHealth(d.n, "h" + i));
}

const routes = document.getElementById("routes");

alternates.forEach((d, i) => {
    const group = document.createElement("div");
    group.className = "group";

    group.innerHTML = `
        <div class="grouphead">
            <div class="domain">${d.n}</div>
            <div id="h${i}" class="health checking">Checking</div>
        </div>
        <div class="grid">
            ${d.v.map(v => `
                <div class="link" onclick="window.open('https://${d.n}${v}','_blank')">
                    <div class="url">${d.n}${v}</div>
                </div>`).join("")}
        </div>`;

    routes.appendChild(group);
    checkHealth(d.n, "h" + i);
});
</script>

</body>
</html>
