<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Assistant | Oogly Boogly Learning</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #14161c;
      --border: #2c313c;
      --text: #f0f3f8;
      --text-dim: #6c7890;
      --accent: #3b82f6; 
      --success: #1e8e3e;
      --danger: #d93025;
      --font-mono: 'JetBrains Mono', monospace;
    }
    body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 40px 20px; margin: 0; }
    .container { max-width: 950px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }
.btn-refresh { border-color: var(--accent); color: var(--accent); }
    .generator-interface {
      background: var(--card-bg); border: 1px solid var(--border);
      padding: 24px; border-radius: 16px; margin-bottom: 50px;
      display: flex; flex-wrap: wrap; gap: 16px;
    }
    .btn-refresh:hover { border-color: var(--accent); color: var(--accent); }
    .generator-interface {
      background: var(--card-bg); border: 1px solid var(--border);
      padding: 24px; border-radius: 16px; margin-bottom: 50px;
      display: flex; flex-wrap: wrap; gap: 16px;
    }
    .custom-select-wrapper { position: relative; flex: 1; min-width: 200px; }
    .custom-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; font-family: var(--font-mono); margin-bottom: 8px; display: block; }
    .custom-input, .custom-select-trigger {
      width: 100%; background: #0f1115; border: 1px solid var(--border);
      color: var(--text); padding: 12px 16px; border-radius: 8px;
      font-family: var(--font-mono); font-size: 14px; outline: none; box-sizing: border-box;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .custom-options {
      position: absolute; top: calc(100% + 5px); left: 0; right: 0;
      background: #1a1d23; border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100;
      display: none; max-height: 200px; overflow-y: auto;
    }
    .custom-options.open { display: block; }
    .option { padding: 10px 16px; font-size: 13px; font-family: var(--font-mono); cursor: pointer; }
    .option:hover { background: var(--accent); color: white; }
    .btn-test {
      background: var(--accent); color: white; border: none;
      padding: 0 30px; height: 45px; border-radius: 8px; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease; align-self: flex-end;
    }
    .route-group { margin-bottom: 40px; }
    .route-title { 
      font-family: var(--font-mono); font-size: 13px; color: var(--accent); 
      margin-bottom: 12px; border-bottom: 1px solid var(--border); 
      padding-bottom: 6px; display: flex; justify-content: space-between;
    }
    .health-indicator { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .health-online { color: var(--success); }
    .health-checking { color: var(--text-dim); }
    .health-offline { color: var(--danger); }
    .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .link-row { 
      background: var(--card-bg); border: 1px solid var(--border); 
      padding: 10px 14px; border-radius: 6px; display: flex; 
      justify-content: space-between; align-items: center; cursor: pointer;
    }
    .url-text { font-family: var(--font-mono); font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .url-variant { color: var(--text-dim); }
    .action-icons { display: flex; gap: 12px; font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); }
    @media (max-width: 768px) { .link-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Access Assistant</h1>
      <p style="color:var(--text-dim); font-size:14px; margin-top:5px;">Automatic diagnostic node monitoring active.</p>
    </div>
    <button class="btn-refresh" onclick="refreshAll()">Check for Blocks</button>
  </header>

  <div class="generator-interface">
    <div class="custom-select-wrapper">
      <span class="custom-label">Target Node</span>
      <div class="custom-select-trigger" onclick="toggleOpts('domain-opts')" id="selected-domain">teststudy.vercel.app</div>
      <div class="custom-options" id="domain-opts"></div>
    </div>
    <div class="custom-select-wrapper" style="min-width: 150px; flex: 0.6;">
      <span class="custom-label">Bypass Mask</span>
      <div class="custom-select-trigger" onclick="toggleOpts('type-opts')" id="selected-type">?math=</div>
      <div class="custom-options" id="type-opts">
        <div class="option" onclick="selectOpt('type', '?math=')">?math=</div>
        <div class="option" onclick="selectOpt('type', '?school=')">?school=</div>
        <div class="option" onclick="selectOpt('type', '?study=')">?study=</div>
        <div class="option" onclick="selectOpt('type', '?mode=')">?mode=</div>
        <div class="option" onclick="selectOpt('type', '#')">#</div>
      </div>
    </div>
    <div class="custom-select-wrapper">
      <span class="custom-label">Extension Value</span>
      <input type="text" class="custom-input" id="gen-kw" placeholder="e.g. syllabus-v6">
    </div>
    <button class="btn-test" id="main-btn" onclick="runTest()">Run Test</button>
  </div>

  <div id="route-container"></div>

  <script>
    const domains = [
      { n: "teststudy.vercel.app", v: ["", "?math=exam", "#archive"] },
      { n: "ooglylearning.vercel.app", v: ["", "?math=review", "#lab"] },
      { n: "ooglygames.vercel.app", v: ["", "?mode=edu", "#stats"] },
      { n: "ooglygames1.netlify.app", v: ["", "?math=stats", "#res"] },
      { n: "ooglygames2.netlify.app", v: ["", "?test=final", "#archive"] },
      { n: "ooglygames3.netlify.app", v: ["", "?p=logic", "#v6"] },
      { n: "oogly.chickennet.work", v: ["", "?mode=edu", "#home"] }
    ];

    const domainOpts = document.getElementById('domain-opts');
    domains.forEach(d => { domainOpts.innerHTML += `<div class="option" onclick="selectOpt('domain', '${d.n}')">${d.n}</div>`; });

    function toggleOpts(id) {
      document.querySelectorAll('.custom-options').forEach(el => { if(el.id !== id) el.classList.remove('open'); });
      document.getElementById(id).classList.toggle('open');
    }

    function selectOpt(type, val) {
      document.getElementById('selected-' + type).innerText = val;
      document.getElementById(type + '-opts').classList.remove('open');
    }

    async function checkHealth(domain, elementId) {
      const statusEl = document.getElementById(elementId);
      statusEl.innerText = "Checking...";
      statusEl.className = "health-indicator health-checking";

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 6000);

      try {
        // no-cors is essential. If the server responds at all (even 403), it's "Online".
        await fetch(`https://${domain}/favicon.ico?cb=${Date.now()}`, { 
          mode: 'no-cors', 
          signal: controller.signal 
        });
        statusEl.innerText = "Online";
        statusEl.className = "health-indicator health-online";
      } catch (e) {
        statusEl.innerText = "Offline";
        statusEl.className = "health-indicator health-offline";
      } finally {
        clearTimeout(timeout);
      }
    }

    function refreshAll() { domains.forEach((d, idx) => checkHealth(d.n, `health-${idx}`)); }

    function runTest() {
      const d = document.getElementById('selected-domain').innerText;
      const t = document.getElementById('selected-type').innerText;
      const k = document.getElementById('gen-kw').value || 'curriculum';
      window.open(`https://${d}${t}${k}`, '_blank');
    }

    // GENERATE LIST AND AUTO-CHECK ON LOAD
    const container = document.getElementById('route-container');
    domains.forEach((d, idx) => {
      const healthId = `health-${idx}`;
      let html = `<div class="route-group"><div class="route-title"><span>${d.n}</span><span id="${healthId}" class="health-indicator health-checking">Checking...</span></div><div class="link-grid">`;
      d.v.forEach(v => {
        const fullUrl = `https://${d.n}${v}`;
        html += `<div class="link-row" onclick="window.open('${fullUrl}', '_blank')"><span class="url-text">${d.n}<span class="url-variant">${v}</span></span><div class="action-icons"><span onclick="event.stopPropagation(); navigator.clipboard.writeText('${fullUrl}'); alert('Copied!');">copy</span><span>open →</span></div></div>`;
      });
      container.innerHTML += html + `</div></div>`;
      
      // Auto-trigger health check for this specific domain immediately
      checkHealth(d.n, healthId);
    });

    window.onclick = (e) => { if (!e.target.matches('.custom-select-trigger')) { document.querySelectorAll('.custom-options').forEach(el => el.classList.remove('open')); } };
  </script>
</div>
</body>
</html>
