<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Home - Classroom</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      padding: 20px;
    }

    .container {
      max-width: 520px;
      width: 100%;
      padding: 50px 40px;
      background: #141414;
      border: 1px solid #1a1a1a;
      border-radius: 8px;
      text-align: center;
    }

    .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 24px;
      background: #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #2a2a2a;
    }

    .icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #666;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #ffffff;
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 24px;
      opacity: 0.7;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #2a2a2a;
      margin: 0 auto 24px;
    }

    p {
      color: #ffffff;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .back-link {
      color: #ffffff;
      text-decoration: none;
      opacity: 0.5;
      font-size: 14px;
      display: inline-block;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #1a1a1a;
      width: 100%;
      transition: opacity 0.2s;
    }

    .back-link:hover {
      opacity: 1;
    }

    @media (max-width: 480px) {
      .container {
        padding: 35px 25px;
      }

      h1 {
        font-size: 20px;
      }

      p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>

    <h1>Page Not Found</h1>
    <div class="subtitle">The page you are looking for does not seem to exist.</div>
    
    <div class="divider"></div>

    <p>This page is not available.</p>

    <a href="/" class="back-link">← Go Back</a>
  </div>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-53Q9XR4QZK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-53Q9XR4QZK');
  </script>
</body>
</html>
