<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Home - Classroom</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #faf8ef;
      color: #776e65;
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      padding: 6px 0 10px;
    }
    .heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 6px;
      gap: 4px;
    }
    .title {
      font-size: 40px;
      font-weight: 700;
      color: #776e65;
      margin: 0;
      line-height: 1;
      letter-spacing: -1px;
    }
    .scores-container {
      display: flex;
      gap: 6px;
    }
    .score-container, .best-container {
      background: #bbada0;
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 6px;
      text-align: center;
      min-width: 56px;
      box-shadow: inset 0 -2px 0 #9a8a7e;
    }
    .score-container span, .best-container span {
      display: block;
      font-size: 20px;
      margin-top: 1px;
      font-weight: 800;
    }
    .above-game {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 4px 0 8px;
      flex-wrap: wrap;
      gap: 4px;
    }
    .game-intro {
      margin: 0;
      font-size: 14px;
      color: #776e65;
      font-weight: 500;
    }
    .game-intro strong {
      font-weight: 800;
      color: #776e65;
      font-size: 13px;
    }
    .restart-button {
      background: #8f7a66;
      color: #f9f6f2;
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 0 #6b5a4a;
      transition: 0.08s linear;
      text-decoration: none;
      display: inline-block;
      line-height: 1.2;
    }
    .restart-button:active {
      transform: translateY(3px);
      box-shadow: none;
    }
    .game-container {
      position: relative;
      background: #bbada0;
      border-radius: 12px;
      padding: 10px;
      touch-action: none;
      box-shadow: 0 6px 0 #9a8a7e;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 700px;
      margin: 0 auto;
      overflow: hidden;
    }
    .grid-container {
      position: relative;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 8px;
      width: 100%;
      height: 100%;
    }
    .grid-cell {
      background: rgba(238, 228, 218, 0.35);
      border-radius: 6px;
      width: 100%;
      aspect-ratio: 1 / 1;
    }
    .tile-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      pointer-events: none;
    }
    .tile {
      position: absolute;
      border-radius: 6px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #776e65;
      background: #eee4da;
      text-align: center;
      line-height: 1.1;
      padding: 0 1px;
      word-break: break-word;
      text-shadow: 0 1px 2px rgba(255,255,255,0.15);
      box-shadow: 0 2px 0 #b8a99a;
      transition: none;
      will-change: transform, opacity, top, left;
      z-index: 1;
      width: calc((100% - 7 * 8px) / 8);
      height: calc((100% - 7 * 8px) / 8);
    }
    .tile.pop {
      animation: pop 0.15s ease-out;
    }
    @keyframes pop {
      0% { transform: scale(0.6); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .tile.merge {
      animation: mergePop 0.2s ease-out;
    }
    @keyframes mergePop {
      0% { transform: scale(0.85); opacity: 0.7; }
      40% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .tile.slide {
      transition: top 0.1s ease-out, left 0.1s ease-out;
    }

    /* tile colors for 8x8 */
    .tile[data-value="2"] { background: #eee4da; font-size: 1.5rem; }
    .tile[data-value="4"] { background: #ede0c8; font-size: 1.5rem; }
    .tile[data-value="8"] { background: #f2b179; color: #f9f6f2; font-size: 1.5rem; }
    .tile[data-value="16"] { background: #f59563; color: #f9f6f2; font-size: 1.3rem; }
    .tile[data-value="32"] { background: #f67c5f; color: #f9f6f2; font-size: 1.3rem; }
    .tile[data-value="64"] { background: #f65e3b; color: #f9f6f2; font-size: 1.3rem; }
    .tile[data-value="128"] { background: #edcf72; color: #f9f6f2; font-size: 1.1rem; }
    .tile[data-value="256"] { background: #edcc61; color: #f9f6f2; font-size: 1.1rem; }
    .tile[data-value="512"] { background: #edc850; color: #f9f6f2; font-size: 1.1rem; }
    .tile[data-value="1024"] { background: #edc53f; color: #f9f6f2; font-size: 0.95rem; }
    .tile[data-value="2048"] { background: #edc22e; color: #f9f6f2; font-size: 0.95rem; }
    .tile[data-value="4096"] { background: #60d992; color: #f9f6f2; font-size: 0.85rem; }
    .tile[data-value="8192"] { background: #3c9a6b; color: #f9f6f2; font-size: 0.85rem; }
    .tile[data-value="16384"] { background: #317f5a; color: #f9f6f2; font-size: 0.75rem; }
    .tile[data-value="32768"] { background: #266648; color: #f9f6f2; font-size: 0.75rem; }
    .tile[data-value="65536"] { background: #1b4d34; color: #f9f6f2; font-size: 0.65rem; }
    .tile[data-value="131072"] { background: #1a4a3a; color: #f9f6f2; font-size: 0.6rem; }
    .tile[data-value="262144"] { background: #1a3f33; color: #f9f6f2; font-size: 0.55rem; }
    .tile[data-value="524288"] { background: #16332a; color: #f9f6f2; font-size: 0.5rem; }
    .tile[data-value="1048576"] { background: #132b23; color: #f9f6f2; font-size: 0.45rem; }
    .tile[data-value="2097152"] { background: #0f221c; color: #f9f6f2; font-size: 0.4rem; }
    .tile[data-value="4194304"] { background: #0c1c17; color: #f9f6f2; font-size: 0.38rem; }
    .tile[data-value="8388608"] { background: #0a1612; color: #f9f6f2; font-size: 0.35rem; }
    .tile[data-value="16777216"] { background: #08120f; color: #f9f6f2; font-size: 0.32rem; }
    .tile[data-value="33554432"] { background: #060d0b; color: #f9f6f2; font-size: 0.3rem; }
    .tile[data-value="67108864"] { background: #050908; color: #f9f6f2; font-size: 0.28rem; }
    .tile[data-value="134217728"] { background: #040707; color: #f9f6f2; font-size: 0.25rem; }
    .tile[data-value="268435456"] { background: #030505; color: #f9f6f2; font-size: 0.22rem; }
    .tile[data-value="536870912"] { background: #020303; color: #f9f6f2; font-size: 0.2rem; }
    .tile[data-value="1073741824"] { background: #010202; color: #f9f6f2; font-size: 0.18rem; }
    .tile[data-value="2147483648"] { background: #000101; color: #f9f6f2; font-size: 0.16rem; }
    .tile[data-value="4294967296"] { background: #000000; color: #f9f6f2; font-size: 0.14rem; }
    .tile[data-value="8589934592"] { background: #000000; color: #f9f6f2; font-size: 0.12rem; }
    .tile[data-value="17179869184"] { background: #000000; color: #f9f6f2; font-size: 0.11rem; }
    .tile[data-value="34359738368"] { background: #000000; color: #f9f6f2; font-size: 0.1rem; }
    .tile[data-value="68719476736"] { background: #000000; color: #f9f6f2; font-size: 0.09rem; }
    .tile[data-value="137438953472"] { background: #000000; color: #f9f6f2; font-size: 0.08rem; }
    .tile[data-value="274877906944"] { background: #000000; color: #f9f6f2; font-size: 0.07rem; }
    .tile[data-value="549755813888"] { background: #000000; color: #f9f6f2; font-size: 0.065rem; }
    .tile[data-value="1099511627776"] { background: #000000; color: #f9f6f2; font-size: 0.06rem; }
    .tile[data-value="2199023255552"] { background: #000000; color: #f9f6f2; font-size: 0.055rem; }
    .tile[data-value="4398046511104"] { background: #000000; color: #f9f6f2; font-size: 0.05rem; }
    .tile[data-value="8796093022208"] { background: #000000; color: #f9f6f2; font-size: 0.045rem; }
    .tile[data-value="9007199254740992"] { background: #1a0a2e; color: #f9f6f2; font-size: 0.5rem; box-shadow: 0 0 20px #ffdd77; }

    .game-message {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(238, 228, 218, 0.78);
      border-radius: 12px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      backdrop-filter: blur(3px);
      padding: 16px;
      text-align: center;
    }
    .game-message.active {
      display: flex;
    }
    .game-message p {
      font-size: 2.2rem;
      font-weight: 800;
      margin: 0 0 14px;
      color: #776e65;
      line-height: 1.2;
      word-break: break-word;
    }
    .lower {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .lower a {
      background: #8f7a66;
      color: #f9f6f2;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 3px 0 #6b5a4a;
      transition: 0.08s linear;
      text-decoration: none;
      display: inline-block;
      line-height: 1.2;
    }
    .lower a:active {
      transform: translateY(3px);
      box-shadow: none;
    }
    .game-explanation {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: #776e65;
      padding: 0 4px;
    }
    .game-explanation strong {
      font-weight: 700;
    }
    @media (max-width: 600px) {
      .title { font-size: 30px; }
      .score-container, .best-container { padding: 2px 8px; min-width: 48px; font-size: 10px; }
      .score-container span, .best-container span { font-size: 16px; }
      .game-container { padding: 6px; }
      .grid-container { gap: 5px; }
      .tile-container { top: 6px; left: 6px; right: 6px; bottom: 6px; }
      .tile { font-size: 1.0rem; width: calc((100% - 7 * 5px) / 8); height: calc((100% - 7 * 5px) / 8); }
      .tile[data-value="128"] { font-size: 0.8rem; }
      .tile[data-value="256"] { font-size: 0.8rem; }
      .tile[data-value="512"] { font-size: 0.8rem; }
      .tile[data-value="1024"] { font-size: 0.7rem; }
      .tile[data-value="2048"] { font-size: 0.7rem; }
      .game-message p { font-size: 1.6rem; }
    }
    @media (max-width: 420px) {
      .title { font-size: 22px; }
      .game-container { padding: 4px; }
      .grid-container { gap: 4px; }
      .tile-container { top: 4px; left: 4px; right: 4px; bottom: 4px; }
      .tile { font-size: 0.7rem; width: calc((100% - 7 * 4px) / 8); height: calc((100% - 7 * 4px) / 8); }
      .tile[data-value="128"] { font-size: 0.55rem; }
      .tile[data-value="256"] { font-size: 0.55rem; }
      .tile[data-value="512"] { font-size: 0.55rem; }
      .tile[data-value="1024"] { font-size: 0.5rem; }
      .tile[data-value="2048"] { font-size: 0.5rem; }
      .game-message p { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="heading">
    <h1 class="title">9007199254740992</h1>
    <div class="scores-container">
      <div class="score-container">SCORE<span id="scoreDisplay">0</span></div>
      <div class="best-container">BEST<span id="bestDisplay">0</span></div>
    </div>
  </div>
  <div class="above-game">
    <p class="game-intro">Join the numbers and get to the <strong>9007199254740992</strong> tile!</p>
    <a class="restart-button" id="restartBtn">New Game</a>
  </div>
  <div class="game-container" id="gameContainer">
    <div class="game-message" id="gameMessage">
      <p id="messageText">You win!</p>
      <div class="lower">
        <a class="keep-playing-button" id="keepPlayingBtn">Keep going</a>
        <a class="retry-button" id="retryBtn">Try again</a>
      </div>
    </div>
    <div class="grid-container" id="gridContainer">
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    </div>
    <div class="tile-container" id="tileContainer"></div>
  </div>
  <p class="game-explanation">
    <strong>Arrow keys</strong> or swipe · <strong>WASD</strong> works!
  </p>
</div>
<script>
  (function(){
    const WINNING_VALUE = 9007199254740992;
    const SIZE = 8;
    const TOTAL = SIZE * SIZE;
    let grid = Array(TOTAL).fill(0);
    let score = 0;
    let best = parseInt(localStorage.getItem('best2048_8x8')) || 0;
    let gameOver = false;
    let win = false;
    let keepPlaying = false;
    let animating = false;

    const tileContainer = document.getElementById('tileContainer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const bestDisplay = document.getElementById('bestDisplay');
    const gameMessage = document.getElementById('gameMessage');
    const messageText = document.getElementById('messageText');
    const restartBtn = document.getElementById('restartBtn');
    const retryBtn = document.getElementById('retryBtn');
    const keepPlayingBtn = document.getElementById('keepPlayingBtn');

    function updateBest() {
      if (score > best) {
        best = score;
        localStorage.setItem('best2048_8x8', best);
      }
      bestDisplay.textContent = best;
    }
    function updateScore() {
      scoreDisplay.textContent = score;
      updateBest();
    }

    function getTilePosition(index) {
      const containerRect = tileContainer.getBoundingClientRect();
      const gap = window.innerWidth <= 600 ? 5 : (window.innerWidth <= 420 ? 4 : 8);
      const tileSize = (tileContainer.offsetWidth - (SIZE - 1) * gap) / SIZE;
      const row = Math.floor(index / SIZE);
      const col = index % SIZE;
      return {
        left: col * (tileSize + gap),
        top: row * (tileSize + gap)
      };
    }

    function render(mergePositions = null, slideMap = null) {
      // Remove all tiles
      tileContainer.innerHTML = '';
      
      for (let i = 0; i < TOTAL; i++) {
        const val = grid[i];
        if (val === 0) continue;
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.setAttribute('data-value', val);
        tile.textContent = val.toLocaleString();
        
        const pos = getTilePosition(i);
        tile.style.left = pos.left + 'px';
        tile.style.top = pos.top + 'px';
        tile.style.width = ((tileContainer.offsetWidth - (SIZE - 1) * (window.innerWidth <= 600 ? 5 : (window.innerWidth <= 420 ? 4 : 8))) / SIZE) + 'px';
        tile.style.height = tile.style.width;
        
        // Check if this tile was merged
        if (mergePositions && mergePositions.has(i)) {
          tile.classList.add('merge');
        }
        
        // Check if this tile is sliding from another position
        if (slideMap && slideMap.has(i)) {
          const fromPos = slideMap.get(i);
          const fromPixel = getTilePosition(fromPos);
          // Set starting position for animation
          tile.style.transition = 'none';
          tile.style.left = fromPixel.left + 'px';
          tile.style.top = fromPixel.top + 'px';
          // Force reflow
          tile.offsetHeight;
          // Animate to current position
          tile.style.transition = 'left 0.12s ease-out, top 0.12s ease-out';
          tile.style.left = pos.left + 'px';
          tile.style.top = pos.top + 'px';
          // Remove transition after animation
          setTimeout(() => {
            tile.style.transition = 'none';
          }, 130);
        }
        
        tileContainer.appendChild(tile);
      }
      
      // Check win condition
      if (!win && !gameOver && grid.includes(WINNING_VALUE) && !keepPlaying) {
        win = true;
        gameMessage.classList.add('active');
        messageText.textContent = '🎉 You reached 9,007,199,254,740,992!';
        keepPlayingBtn.style.display = 'inline-block';
        retryBtn.style.display = 'inline-block';
      }
      if (!gameOver && !win && isGameOver()) {
        gameOver = true;
        gameMessage.classList.add('active');
        messageText.textContent = '💥 Game Over!';
        keepPlayingBtn.style.display = 'none';
        retryBtn.style.display = 'inline-block';
      }
      if (keepPlaying && win) {
        gameMessage.classList.remove('active');
      }
      updateScore();
    }

    function isGameOver() {
      for (let i = 0; i < TOTAL; i++) {
        if (grid[i] === 0) return false;
        const r = Math.floor(i / SIZE), c = i % SIZE;
        if (c < SIZE-1 && grid[i] === grid[i + 1]) return false;
        if (r < SIZE-1 && grid[i] === grid[i + SIZE]) return false;
      }
      return true;
    }

    // Slide function that returns slide map (newIndex -> oldIndex)
    function slideRow(row, startIdx) {
      let arr = row.map((v, idx) => ({ val: v, idx: startIdx + idx }));
      let filtered = arr.filter(item => item.val !== 0);
      let merged = [];
      let gain = 0;
      let mergeIndices = [];
      let slideMap = new Map();
      let pos = 0;
      for (let i = 0; i < filtered.length; i++) {
        if (i + 1 < filtered.length && filtered[i].val === filtered[i+1].val) {
          const val = filtered[i].val * 2;
          merged.push({ val, oldIdx: filtered[i].idx });
          gain += val;
          mergeIndices.push(startIdx + pos);
          slideMap.set(startIdx + pos, filtered[i].idx);
          i++;
          pos++;
        } else {
          merged.push({ val: filtered[i].val, oldIdx: filtered[i].idx });
          slideMap.set(startIdx + pos, filtered[i].idx);
          pos++;
        }
      }
      while (merged.length < SIZE) merged.push({ val: 0, oldIdx: -1 });
      return { row: merged.map(m => m.val), score: gain, mergeIndices, slideMap };
    }

    function moveLeft() {
      let moved = false, gain = 0;
      let allMergeIndices = [];
      let allSlideMap = new Map();
      for (let r = 0; r < SIZE; r++) {
        const start = r * SIZE;
        const row = grid.slice(start, start + SIZE);
        const result = slideRow(row, start);
        const newRow = result.row;
        gain += result.score;
        allMergeIndices.push(...result.mergeIndices);
        for (let [newIdx, oldIdx] of result.slideMap) {
          allSlideMap.set(newIdx, oldIdx);
        }
        for (let c = 0; c < SIZE; c++) {
          if (grid[start + c] !== newRow[c]) moved = true;
          grid[start + c] = newRow[c];
        }
      }
      if (moved) score += gain;
      return { moved, mergeIndices: allMergeIndices, slideMap: allSlideMap };
    }
    
    function moveRight() {
      let moved = false, gain = 0;
      let allMergeIndices = [];
      let allSlideMap = new Map();
      for (let r = 0; r < SIZE; r++) {
        const start = r * SIZE;
        const row = grid.slice(start, start + SIZE).reverse();
        const result = slideRow(row, start);
        const newRow = result.row.reverse();
        gain += result.score;
        const adjustedMerge = result.mergeIndices.map(idx => start + (SIZE-1 - (idx - start)));
        allMergeIndices.push(...adjustedMerge);
        for (let [newIdx, oldIdx] of result.slideMap) {
          const adjustedNew = start + (SIZE-1 - (newIdx - start));
          allSlideMap.set(adjustedNew, oldIdx);
        }
        for (let c = 0; c < SIZE; c++) {
          if (grid[start + c] !== newRow[c]) moved = true;
          grid[start + c] = newRow[c];
        }
      }
      if (moved) score += gain;
      return { moved, mergeIndices: allMergeIndices, slideMap: allSlideMap };
    }
    
    function moveUp() {
      let moved = false, gain = 0;
      let allMergeIndices = [];
      let allSlideMap = new Map();
      for (let c = 0; c < SIZE; c++) {
        const col = [];
        for (let r = 0; r < SIZE; r++) col.push(grid[c + r*SIZE]);
        const result = slideRow(col, c);
        const newCol = result.row;
        gain += result.score;
        const mappedMerge = result.mergeIndices.map(colPos => c + (colPos - c) * SIZE);
        allMergeIndices.push(...mappedMerge);
        for (let [newIdx, oldIdx] of result.slideMap) {
          const mappedNew = c + (newIdx - c) * SIZE;
          allSlideMap.set(mappedNew, oldIdx);
        }
        for (let r = 0; r < SIZE; r++) {
          const idx = c + r*SIZE;
          if (grid[idx] !== newCol[r]) moved = true;
          grid[idx] = newCol[r];
        }
      }
      if (moved) score += gain;
      return { moved, mergeIndices: allMergeIndices, slideMap: allSlideMap };
    }
    
    function moveDown() {
      let moved = false, gain = 0;
      let allMergeIndices = [];
      let allSlideMap = new Map();
      for (let c = 0; c < SIZE; c++) {
        const col = [];
        for (let r = SIZE-1; r >= 0; r--) col.push(grid[c + r*SIZE]);
        const result = slideRow(col, c);
        const newCol = result.row.reverse();
        gain += result.score;
        const mappedMerge = result.mergeIndices.map(colPos => c + (SIZE-1 - (colPos - c)) * SIZE);
        allMergeIndices.push(...mappedMerge);
        for (let [newIdx, oldIdx] of result.slideMap) {
          const mappedNew = c + (SIZE-1 - (newIdx - c)) * SIZE;
          allSlideMap.set(mappedNew, oldIdx);
        }
        for (let r = 0; r < SIZE; r++) {
          const idx = c + r*SIZE;
          if (grid[idx] !== newCol[r]) moved = true;
          grid[idx] = newCol[r];
        }
      }
      if (moved) score += gain;
      return { moved, mergeIndices: allMergeIndices, slideMap: allSlideMap };
    }

    function addRandomTile() {
      const empty = [];
      for (let i = 0; i < TOTAL; i++) if (grid[i] === 0) empty.push(i);
      if (empty.length === 0) return null;
      const idx = empty[Math.floor(Math.random() * empty.length)];
      grid[idx] = Math.random() < 0.9 ? 2 : 4;
      return idx;
    }

    function resetGame() {
      grid = Array(TOTAL).fill(0);
      score = 0;
      gameOver = false;
      win = false;
      keepPlaying = false;
      gameMessage.classList.remove('active');
      addRandomTile();
      addRandomTile();
      render(new Set());
    }

    function handleMove(direction) {
      if (gameOver || animating) return;
      if (win && !keepPlaying) return;
      
      let result = { moved: false, mergeIndices: [], slideMap: new Map() };
      switch (direction) {
        case 'left': result = moveLeft(); break;
        case 'right': result = moveRight(); break;
        case 'up': result = moveUp(); break;
        case 'down': result = moveDown(); break;
      }
      
      if (result.moved) {
        animating = true;
        const mergeSet = new Set(result.mergeIndices);
        const slideMap = result.slideMap;
        
        // Render with slide animation
        render(mergeSet, slideMap);
        
        // Add new tile after animation
        setTimeout(() => {
          const newPos = addRandomTile();
          // Re-render without slide info but with pop animation for new tile
          render(mergeSet);
          // Add pop animation to new tile
          if (newPos !== null) {
            const tiles = tileContainer.children;
            for (let tile of tiles) {
              const rect = tile.getBoundingClientRect();
              const pos = getTilePosition(newPos);
              if (Math.abs(parseFloat(tile.style.left) - pos.left) < 1 && 
                  Math.abs(parseFloat(tile.style.top) - pos.top) < 1) {
                tile.classList.add('pop');
                break;
              }
            }
          }
          animating = false;
        }, 150);
      } else {
        render(new Set());
      }
    }

    // Keyboard events
    document.addEventListener('keydown', (e) => {
      const key = e.key;
      let dir = null;
      if (key === 'ArrowLeft' || key === 'a' || key === 'A') dir = 'left';
      else if (key === 'ArrowRight' || key === 'd' || key === 'D') dir = 'right';
      else if (key === 'ArrowUp' || key === 'w' || key === 'W') dir = 'up';
      else if (key === 'ArrowDown' || key === 's' || key === 'S') dir = 'down';
      if (dir) {
        e.preventDefault();
        handleMove(dir);
      }
    });

    // Swipe
    let startX = 0, startY = 0;
    const container = document.getElementById('gameContainer');
    container.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      startX = t.clientX;
      startY = t.clientY;
    }, { passive: true });
    container.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    container.addEventListener('touchend', (e) => {
      if (startX === 0 && startY === 0) return;
      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;
      const dx = endX - startX, dy = endY - startY;
      if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        handleMove(dx > 0 ? 'right' : 'left');
      } else {
        handleMove(dy > 0 ? 'down' : 'up');
      }
      startX = 0; startY = 0;
    }, { passive: true });

    restartBtn.addEventListener('click', resetGame);
    retryBtn.addEventListener('click', resetGame);
    keepPlayingBtn.addEventListener('click', () => {
      keepPlaying = true;
      gameMessage.classList.remove('active');
      render(new Set());
    });

    // Window resize handler to reposition tiles
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        if (!animating) render(new Set());
      }, 100);
    });

    resetGame();
  })();
</script>
</body>
